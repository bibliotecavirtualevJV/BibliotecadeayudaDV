<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo Completo - Biblioteca Digital (USAC)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    /* ESTILOS DEL ENCABEZADO Y BANNER SUPERIOR */
    .top-header {
      background-color: #5b2c91;
      color: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .logo-area-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: opacity 0.2s ease;
    }

    .logo-area-link:hover {
      opacity: 0.9;
    }

    .usac-title {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .usac-title span {
      color: #f39c12;
    }

    .fahusac-title {
      font-size: 0.85rem;
      color: #e0e0e0;
    }

    .header-right {
      text-align: right;
    }

    .header-right h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .header-right h2 a {
      color: #ffffff;
      text-decoration: none;
    }

    .header-right p {
      margin: 0;
      font-size: 0.8rem;
      color: #d1c4e9;
    }

    .main-container {
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-catalogo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    /* GRID DE 5 COLUMNAS X 10 FILAS (50 LIBROS) */
    .grid-5x10 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    /* TARJETA DE LIBRO */
    .card-libro {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .card-libro:hover {
      transform: translateY(-5px);
    }

    .portada-placeholder {
      background-color: #e0e0e0;
      height: 180px;
      position: relative;
    }

    .badge-pdf {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #000;
      color: #fff;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
    }

    .info-libro {
      padding: 15px;
      text-align: center;
    }

    .titulo-libro {
      font-size: 1rem;
      color: #1a2b4c;
      margin: 0 0 8px 0;
      font-weight: bold;
    }

    .autor-libro {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 15px;
    }

    .btn-descargar {
      background-color: #5b2c91;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    /* ESTILOS DE PAGINACIÓN */
    .paginacion-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 40px 0 20px 0;
    }

    .btn-pagina {
      padding: 10px 16px;
      background: #e2e2e2;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn-pagina.activo,
    .btn-pagina.active {
      background: #5b2c91;
      color: #fff;
    }

    .btn-siguiente {
      padding: 10px 20px;
      background: #f39c12;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO SUPERIOR / BANNER MENÚ (REDIRECCIONA A INDEX.HTML) -->
  <header class="top-header">
    <a href="index.html" class="logo-area-link" title="Volver al inicio">
      <div class="usac-title">USAC <span>TRICENTENARIA</span></div>
      <div class="fahusac-title">Facultad de Humanidades | Depto. Educación Virtual</div>
    </a>
    <div class="header-right">
      <h2><a href="index.html" title="Volver al inicio"><i class="fa-solid fa-house"></i> Biblioteca Digital</a></h2>
      <p>Ir a la página principal</p>
    </div>
  </header>

  <main class="main-container">
    <div class="header-catalogo">
      <h2 style="color: #5b2c91;" id="lbl-pagina">Catálogo de Libros</h2>
    </div>

    <!-- CONTENEDOR GRID 5X10 -->
    <div id="contenedor-libros" class="grid-5x10"></div>

    <!-- BARRA DE PAGINACIÓN (UBICADA CORRECTAMENTE EN EL HTML) -->
    <div id="paginacion-bottom" class="paginacion-container"></div>
  </main>

  <!-- ARCHIVOS JAVASCRIPT EXTERNOS -->
  <script src="cursos.js"></script>
  <script src="paginacion.js"></script>
<!-- LÓGICA DE RENDERIZADO CORREGIDA -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Obtener el número de página de la URL (?pagina=1 por defecto)
      const params = new URLSearchParams(window.location.search);
      const paginaActual = parseInt(params.get('pagina')) || 1;
      
      const lblPagina = document.getElementById('lbl-pagina');
      if (lblPagina) {
        lblPagina.textContent = `Catálogo Completo - Página ${paginaActual}`;
      }

      // 2. Validar que la base de datos de cursos.js exista
      if (typeof BASE_CURSOS === 'undefined' || !Array.isArray(BASE_CURSOS)) {
        console.error('Error: BASE_CURSOS no está cargada. Asegúrate de que cursos.js esté en la misma carpeta.');
        const contenedor = document.getElementById('contenedor-libros');
        if (contenedor) {
          contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">Error: No se pudieron cargar los libros desde cursos.js</p>';
        }
        return;
      }

      // 3. Calcular la porción de libros a mostrar (ej. 50 libros por página)
      const limitePorPagina = 50;
      const inicio = (paginaActual - 1) * limitePorPagina;
      const fin = inicio + limitePorPagina;

      const librosPagina = BASE_CURSOS.slice(inicio, fin);
      const contenedor = document.getElementById('contenedor-libros');

      if (!contenedor) return;
      contenedor.innerHTML = '';

      if (librosPagina.length === 0) {
        contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">No hay libros registrados en esta página.</p>';
        return;
      }

      // 4. Generar las tarjetas idénticas a la portada principal
      librosPagina.forEach(libro => {
        const card = document.createElement('div');
        card.className = 'card-libro';

        const titulo = libro.nombre || libro.titulo || 'Sin título';
        const autor = libro.autor || 'Cátedra Académica';
        const codigo = libro.id || libro.codigo || 'LIBRO';
        const formato = libro.modalidad || libro.formato || 'PDF';
        const enlace = libro.link || libro.enlace || '#';

        // Verificar si existe imagen de portada, de lo contrario mostrar fondo morado con el código
        const htmlPortada = libro.portada 
          ? `<img src="${libro.portada}" alt="${titulo}" style="width: 100%; height: 180px; object-fit: contain; background: #f1f3f5; display: block;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
             <div style="display: none; height: 180px; background: #5b2c91; color: #fff; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;">
               ${codigo}
             </div>`
          : `<div style="display: flex; height: 180px; background: #5b2c91; color: #fff; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;">
               ${codigo}
             </div>`;

        card.innerHTML = `
          <div class="portada-placeholder" style="position: relative; height: 180px; overflow: hidden; background: #f1f3f5;">
            ${htmlPortada}
            <span class="badge-pdf" style="z-index: 2; position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 3px 8px; font-size: 0.75rem; border-radius: 4px;">
              ${formato.toUpperCase()}
            </span>
          </div>
          <div class="info-libro" style="padding: 15px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between;">
            <div>
              <h3 class="titulo-libro" style="font-size: 0.95rem; color: #1a2b4c; margin: 0 0 6px 0; font-weight: bold;">${titulo}</h3>
              <p class="autor-libro" style="font-size: 0.8rem; color: #666; margin-bottom: 12px;">Por: ${autor}</p>
            </div>
            <a href="${enlace}" class="btn-descargar" target="_blank" style="background-color: #5b2c91; color: white; border: none; padding: 10px 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
              <i class="fa-solid fa-download"></i> Descargar
            </a>
          </div>
        `;
        contenedor.appendChild(card);
      });

      // 5. Generar la barra de paginación automáticamente
      const totalPaginas = Math.ceil(BASE_CURSOS.length / limitePorPagina);
      const paginacionContainer = document.getElementById('paginacion-bottom');

      if (paginacionContainer && totalPaginas > 1) {
        paginacionContainer.innerHTML = '';

        for (let i = 1; i <= totalPaginas; i++) {
          const enlace = document.createElement('a');
          enlace.textContent = i;
          enlace.href = `catalogo.html?pagina=${i}`;
          enlace.className = `btn-pagina ${i === paginaActual ? 'activo' : ''}`;
          paginacionContainer.appendChild(enlace);
        }

        if (paginaActual < totalPaginas) {
          const btnSig = document.createElement('a');
          btnSig.textContent = 'Página siguiente »';
          btnSig.href = `catalogo.html?pagina=${paginaActual + 1}`;
          btnSig.className = 'btn-siguiente';
          paginacionContainer.appendChild(btnSig);
        }
      }
    });
  </script>
</body>
</html>
